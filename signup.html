<!DOCTYPE html>

<html data-theme="light" dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="Premium Neurology &amp; Headache Care Clinic offering specialized treatments for complex neurological conditions." name="description"/>
<title>Sign Up - Neurology Clinic</title>
<link href="assets/images/logo.svg" rel="icon" type="image/svg\+xml"/>
<link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link crossorigin="anonymous" disabled="" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" id="rtl-stylesheet" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<link href="assets/css/dark-mode.css" rel="stylesheet"/>
<link href="assets/css/rtl.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<div class="min-vh-100 bg-soft d-flex flex-column">
<div class="d-flex justify-content-end p-3 p-md-4 w-100">
<div class="d-flex align-items-center gap-2">
<button aria-label="Toggle Dark Mode" class="btn btn-outline-secondary btn-sm rounded-circle px-2" id="theme-toggle">
<i class="bi bi-moon-stars"></i>
</button>
<button aria-label="Toggle RTL" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-bold" id="rtl-toggle">
                    RTL
                </button>
</div>
</div>
<div class="container flex-grow-1 d-flex flex-column justify-content-center py-4 mb-5">
<div class="row justify-content-center">
<div class="col-md-8 col-lg-7 col-xl-5">
<div class="neuro-card bg-white border-0 shadow p-4 p-md-5 rounded-4">
<div class="text-center mb-4">
<a class="text-primary-brand fw-bold d-inline-block mb-4 fs-5 text-decoration-none" href="index.html">
<img alt="NeurologyCare logo" class="logo-mark me-2 align-text-top" height="34" src="assets/images/logo.svg" width="34"/>NeurologyCare
                            </a>
<h2 class="text-primary-brand fw-bold mb-2">Create Account</h2>
<p class="text-muted-brand">Register to access your secure patient portal</p>
</div>
<form action="dashboard.html">
<div class="mb-3">
<label class="form-label fw-bold text-muted-brand small">Full Name</label>
<input class="form-control py-2" placeholder="Full Name" required="" type="text"/>
</div>
<div class="mb-3">
<label class="form-label fw-bold text-muted-brand small">Email Address</label>
<input class="form-control py-2" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="mb-3">
<label class="form-label fw-bold text-muted-brand small">Password</label>
<div class="input-group">
<input class="form-control py-2 border-end-0" placeholder="Create a password" required="" type="password"/>
<button class="btn btn-outline-secondary border-start-0 border" type="button"><i class="bi bi-eye"></i></button>
</div>
</div>
<div class="mb-4">
<label class="form-label fw-bold text-muted-brand small">Confirm Password</label>
<div class="input-group">
<input class="form-control py-2 border-end-0" placeholder="Confirm your password" required="" type="password"/>
<button class="btn btn-outline-secondary border-start-0 border" type="button"><i class="bi bi-eye"></i></button>
</div>
</div>
<div class="mb-4 form-check">
<input class="form-check-input" id="terms" required="" type="checkbox"/>
<label class="form-check-label text-muted-brand small" for="terms">I agree to the <a class="text-primary-brand text-decoration-none auth-link" href="#">Terms of
                                        Service</a> &amp; <a class="text-primary-brand text-decoration-none auth-link" href="#">Privacy
                                        Policy</a>.</label>
</div>
<button class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-2" type="submit">Create
                                Account</button>
<div class="position-relative my-4">
<hr class="text-muted opacity-25"/>
<span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted-brand small">Or
                                    continue with</span>
</div>
<div class="row g-2 mb-4">
<div class="col-4">
<button class="btn btn-outline-secondary social-btn w-100 py-2 rounded-pill fw-bold text-dark border-opacity-50" type="button">
<i class="bi bi-google text-danger"></i>
</button>
</div>
<div class="col-4">
<button class="btn btn-outline-secondary social-btn w-100 py-2 rounded-pill fw-bold text-dark border-opacity-50" type="button">
<i class="bi bi-apple"></i>
</button>
</div>
<div class="col-4">
<button class="btn btn-outline-secondary social-btn w-100 py-2 rounded-pill fw-bold text-dark border-opacity-50" type="button">
<i class="bi bi-facebook text-primary"></i>
</button>
</div>
</div>
<p class="text-center text-muted-brand mb-0 small">
                                Already have an account? <a class="text-primary-brand text-decoration-none fw-bold auth-link" href="login.html">Log in</a>
</p>
</form>
</div>
</div>
</div>
</div>
</div><!-- Bootstrap JS Bundle -->
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="assets/js/main.js"></script>
</body>
</html>
